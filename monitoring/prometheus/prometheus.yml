# Configuration Prometheus pour PRISME

global:
  scrape_interval: 15s      # Scrape toutes les 15 secondes
  evaluation_interval: 15s  # Évalue les règles toutes les 15 secondes
  external_labels:
    monitor: 'prisme-monitoring'
    environment: 'development'

# Règles d'alertes (optionnel)
rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Job 1 : Métriques des agents PRISME
  - job_name: 'prisme-agents'
    metrics_path: '/grafana_metrics.prom'
    file_sd_configs:
      - files:
        - '/metriques/grafana_metrics.prom'
    static_configs:
      - targets: ['localhost:9090']
    # Scrape les fichiers .prom dans /metriques toutes les 5s
    scrape_interval: 5s

  # Job 2 : Prometheus lui-même (métrique système)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 3 : Node Exporter (métriques machine)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

# Stockage
storage:
  tsdb:
    path: /prometheus
    retention:
      time: 30d    # Garde 30 jours d'historique
      size: 10GB   # Max 10GB
