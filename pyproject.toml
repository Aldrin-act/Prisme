[project]
name = "prisme"
version = "0.1.0"
description = "Génération et exécution de solveurs d'ordonnancement pilotée par IA (FJSP / OR-Tools CP-SAT)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "ortools==9.15.6755",
    "fastapi==0.139.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.6",  # Pour parsing form data FastAPI
    "passlib[bcrypt]>=1.7.4",  # Hachage sécurisé des mots de passe
    "python-dotenv>=1.0.0",  # Gestion des variables d'environnement
    "email-validator>=2.0",  # Requis par pydantic.EmailStr (api/routes/auth.py)
    "pyyaml>=6.0",  # Lecture des configurations secteurs YAML
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff>=0.15.21",
    "uvicorn>=0.30",
]
llm = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.6",
    "langchain-community>=0.3",  # DuckDuckGoSearchRun (outil web du Benchmarker, sans clé API)
    "ddgs>=9.0",  # backend de DuckDuckGoSearchRun (successeur de duckduckgo-search)
]
sandbox = [
    "docker>=7.0",
]
estimation = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# 115, pas les 88/100 habituels : le code et les docstrings sont en français,
# avec des identifiants et une prose plus longs qu'en anglais (voir CLAUDE.md).
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dsl",
    "validation_engine",
    "generation",
    "solver_store",
    "sandbox",
    "adapters",
    "api",
    "scripts",
    "estimation",
]
