[project]
name = "prisme"
version = "0.1.0"
description = "Génération et exécution de solveurs d'ordonnancement pilotée par IA (FJSP / OR-Tools CP-SAT)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "ortools>=9.9",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "uvicorn>=0.30",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
sandbox = [
    "docker>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dsl",
    "validation_engine",
    "solveur_reference",
    "generation",
    "solver_store",
    "sandbox",
    "adapters",
    "api",
    "scripts",
]
