[project]
name = "prisme"
version = "0.1.0"
description = "Génération et exécution de solveurs d'ordonnancement pilotée par IA (FJSP / OR-Tools CP-SAT)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "ortools==9.15.6755",
    "fastapi==0.139.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff>=0.15.21",
    "uvicorn>=0.30",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
    "mistralai>=1.0",
]
sandbox = [
    "docker>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# 115, pas les 88/100 habituels : le code et les docstrings sont en français,
# avec des identifiants et une prose plus longs qu'en anglais (voir CLAUDE.md).
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dsl",
    "validation_engine",
    "generation",
    "solver_store",
    "sandbox",
    "adapters",
    "api",
    "scripts",
]
