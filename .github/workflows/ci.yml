name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # solver_store/registry.py (§7.2, migré depuis SQLite) a besoin d'un
      # vrai serveur Postgres pour les tests d'intégration ; injoignable →
      # ces tests skip plutôt qu'échouent (voir tests/integration/conftest.py),
      # mais on veut qu'ils tournent réellement en CI, pas seulement en local.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisme
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: prisme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisme -d prisme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prisme:changeme@localhost:5432/prisme
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Installer l'environnement (Python 3.11 via .python-version)
        run: uv sync --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
